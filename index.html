<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Curiozități despre Pisici</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to right, #fbd3e9, #bb377d);
      color: #fff;
      padding: 50px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px #000;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2em;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background-color: #fff;
      color: #bb377d;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ffe6f2;
    }

    #curiosity {
      margin-top: 30px;
      font-size: 1.5em;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      background-color: rgba(0,0,0,0.3);
      padding: 20px;
      border-radius: 15px;
    }

    img {
      width: 300px;
      border-radius: 20px;
      margin-top: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <h1>Curiozități despre Pisici 🐱</h1>
  
  <img id="catImage" src="https://cataas.com/cat?width=300&height=300" alt="Pisică drăguță">

  <div>
    <button id="curiosityBtn">Afișează Curiozitate</button>
  </div>

  <p id="curiosity"></p>

  <script>
    const catImg = document.getElementById("catImage");
    const curiosityEl = document.getElementById("curiosity");

    document.getElementById("curiosityBtn").addEventListener("click", async () => {
      try {
        // Preia curiozitate de la API
        const response = await fetch("https://catfact.ninja/fact");
        const data = await response.json();
        curiosityEl.textContent = data.fact;

        // Schimbă imaginea cu una aleatorie
        // Adăugăm un parametru unic pentru a evita cache-ul
        catImg.src = `https://cataas.com/cat?width=300&height=300&timestamp=${new Date().getTime()}`;

      } catch (error) {
        console.error("Eroare la preluarea curiozității:", error);
        alert("Nu s-a putut încărca curiozitatea. Încearcă din nou!");
      }
    });
  </script>
</body>
</html>
