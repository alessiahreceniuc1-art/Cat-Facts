<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Facts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Fapte interesante despre pisici 🐱</h1>
        
        <!-- Card pentru afisarea faptului -->
        <div class="card">
            <p id="cat-fact">Apasă butonul pentru a genera un fapt despre pisici!</p>
        </div>

        <!-- Buton pentru refresh -->
        <button id="new-fact-btn">Generează un nou fapt</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
<!DOCTYPE html>
<html>
<head>
  <title>Curiozitate Pisici</title>
</head>
<body>
  <button id="curiosityBtn">Creat</button>
  <p id="curiosity"></p>

  <script>
    const curiosities = [
      "Pisicile dorm în medie 16 ore pe zi.",
      "Pisicile au 32 de mușchi în fiecare ureche.",
      "Pisicile pot să alerge cu până la 48 km/h.",
      "Pisicile nu pot gusta dulce.",
      "Pisicile folosesc mustățile pentru a simți spațiul din jur."
    ];

    document.getElementById("curiosityBtn").addEventListener("click", () => {
      const randomIndex = Math.floor(Math.random() * curiosities.length);
      document.getElementById("curiosity").textContent = curiosities[randomIndex];
    });
  </script>
</body>
</html>
